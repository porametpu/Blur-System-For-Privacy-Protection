<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="70" y="70" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2563eb" letter-spacing="2">BLURSYSTEM · ADDED PIPELINE</text>
  <text x="70" y="115" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17233c">Real-time person selection and blur</text>
  <text x="70" y="150" font-family="Arial,sans-serif" font-size="17" fill="#64748b">Swimlane view of the added webcam pipeline. The flow repeats for every processed frame.</text>
  <rect x="55" y="185" width="1490" height="610" rx="16" fill="#ffffff" stroke="#d9e1ec"/>
  <text x="85" y="225" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17233c">Live processing flow</text>
  <text x="1350" y="225" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Frame loop · real time</text>
  <line x1="80" y1="250" x2="1520" y2="250" stroke="#d9e1ec"/>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569">
    <text x="100" y="285">Input → output</text><text x="350" y="285">Browser / Webcam</text><text x="650" y="285">Detection API</text><text x="950" y="285">Tracking &amp; Identity</text><text x="1250" y="285">Stabilization &amp; Privacy</text>
  </g>
  <g stroke="#d9e1ec" fill="none"><line x1="320" y1="260" x2="320" y2="760"/><line x1="620" y1="260" x2="620" y2="760"/><line x1="920" y1="260" x2="920" y2="760"/><line x1="1220" y1="260" x2="1220" y2="760"/><line x1="80" y1="305" x2="1520" y2="305"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#17233c">
    <g transform="translate(340 330)"><rect width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="37">Capture video frame</text><rect y="82" width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect y="82" width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="119">Send JPEG + session ID</text><rect y="164" width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect y="164" width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="201">Render source frame</text><rect y="246" width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect y="246" width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="283">Apply blur on Canvas</text></g>
    <g transform="translate(640 330)"><rect width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="37">Decode frame</text><rect y="82" width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect y="82" width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="119">Run YOLO face detection</text><rect y="164" width="250" height="62" rx="9" fill="#eef4ff" stroke="#b9cdfa"/><rect y="164" width="5" height="62" rx="2" fill="#2563eb"/><text x="18" y="201">Return boxes + confidence</text></g>
    <g transform="translate(940 330)"><rect width="250" height="62" rx="9" fill="#eef8f3" stroke="#b8dec9"/><rect width="5" height="62" rx="2" fill="#16a36a"/><text x="18" y="37">Match by IoU</text><rect y="82" width="250" height="62" rx="9" fill="#eef8f3" stroke="#b8dec9"/><rect y="82" width="5" height="62" rx="2" fill="#16a36a"/><text x="18" y="119">Reuse persistent person ID</text><rect y="164" width="250" height="62" rx="9" fill="#eef8f3" stroke="#b8dec9"/><rect y="164" width="5" height="62" rx="2" fill="#16a36a"/><text x="18" y="201">Face embedding re-ID</text><rect y="246" width="250" height="62" rx="9" fill="#eef8f3" stroke="#b8dec9"/><rect y="246" width="5" height="62" rx="2" fill="#16a36a"/><text x="18" y="283">Retain missed tracks</text></g>
    <g transform="translate(1240 330)"><rect width="250" height="62" rx="9" fill="#f3efff" stroke="#d4c8f5"/><rect width="5" height="62" rx="2" fill="#7c55c7"/><text x="18" y="37">Median history filter</text><rect y="82" width="250" height="62" rx="9" fill="#f3efff" stroke="#d4c8f5"/><rect y="82" width="5" height="62" rx="2" fill="#7c55c7"/><text x="18" y="119">Selected-track smoothing</text><rect y="164" width="250" height="62" rx="9" fill="#f3efff" stroke="#d4c8f5"/><rect y="164" width="5" height="62" rx="2" fill="#7c55c7"/><text x="18" y="201">Choose privacy mode</text><rect y="246" width="250" height="62" rx="9" fill="#f3efff" stroke="#d4c8f5"/><rect y="246" width="5" height="62" rx="2" fill="#7c55c7"/><text x="18" y="283">Gaussian / Pixelate / Black Box</text></g>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#17233c"><rect x="70" y="845" width="460" height="90" rx="12" fill="#ffffff" stroke="#d9e1ec"/><text x="95" y="878" font-weight="700" fill="#2563eb">Selection persistence</text><text x="95" y="905" fill="#64748b">Session ID + person ID preserve selection after re-entry.</text><rect x="570" y="845" width="460" height="90" rx="12" fill="#ffffff" stroke="#d9e1ec"/><text x="595" y="878" font-weight="700" fill="#2563eb">Jitter reduction</text><text x="595" y="905" fill="#64748b">IoU, retained tracks, median filter, and smoothing.</text><rect x="1070" y="845" width="460" height="90" rx="12" fill="#ffffff" stroke="#d9e1ec"/><text x="1095" y="878" font-weight="700" fill="#2563eb">Privacy output</text><text x="1095" y="905" fill="#64748b">Redraw the original frame before each effect.</text></g>
</svg>
